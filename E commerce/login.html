<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        /* From Uiverse.io by alexruix */ 
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #171821,
        #252638,
        #171821
    );

    color: #f5f5f5;
}


/* =========================
   LOGIN CARD
========================= */

.card {
    width: 420px;
    min-height: 480px;

    padding: 45px 38px;

    background: #2a2b38;

    border: 1px solid rgba(255, 255, 255, 0.08);

    border-radius: 16px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45);

    position: relative;

    overflow: hidden;
}


/* Small glow at top */

.card::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -100px;
    right: -70px;

    background: #ffeba7;

    opacity: 0.08;

    border-radius: 50%;

    filter: blur(20px);
}


/* =========================
   TITLE
========================= */

.title {
    text-align: center;

    margin-bottom: 35px;

    font-size: 32px;

    font-weight: 600;

    letter-spacing: 0.5px;

    color: #ffffff;
}


/* =========================
   INPUT FIELD
========================= */

.field {
    width: 100%;

    height: 55px;

    margin-bottom: 16px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 0 16px;

    background: #1f2029;

    border: 1px solid transparent;

    border-radius: 8px;

    transition: all 0.3s ease;
}


/* Input icon */

.input-icon {
    width: 19px;
    height: 19px;

    flex-shrink: 0;

    fill: #ffeba7;

    transition: 0.3s ease;
}


/* Input */

.input-field {
    width: 100%;

    height: 100%;

    background: transparent;

    border: none;

    outline: none;

    color: #ffffff;

    font-size: 15px;
}


/* Placeholder */

.input-field::placeholder {
    color: #858692;

    transition: opacity 0.3s ease;
}


/* Focus */

.field:focus-within {
    border-color: #ffeba7;

    box-shadow:
        0 0 0 3px rgba(255, 235, 167, 0.08);
}

.field:focus-within .input-icon {
    transform: scale(1.1);
}


/* Hide placeholder on focus */

.input-field:focus::placeholder {
    opacity: 0;
}


/* =========================
   LOGIN BUTTON
========================= */

.btn {
    width: 100%;

    height: 52px;

    margin: 20px 0 18px;

    border: none;

    border-radius: 8px;

    background: #ffeba7;

    color: #2a2b38;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 0.5px;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(255, 235, 167, 0.15);

    transition: all 0.3s ease;
}


/* Button hover */

.btn:hover {
    background: #ffffff;

    transform: translateY(-2px);

    box-shadow:
        0 10px 25px rgba(255, 235, 167, 0.2);
}


/* Button click */

.btn:active {
    transform: translateY(0);
}


/* =========================
   FORGOT PASSWORD
========================= */

.btn-link {
    display: block;

    text-align: center;

    color: #b8b9c2;

    font-size: 14px;

    text-decoration: underline;

    cursor: pointer;

    transition: 0.3s ease;
}


.btn-link:hover {
    color: #ffeba7;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 500px) {

    body {
        padding: 20px;
    }

    .card {
        width: 100%;

        min-height: 450px;

        padding: 35px 25px;
    }

    .title {
        font-size: 28px;

        margin-bottom: 30px;
    }
}
    </style>
</head>
<body>
    <!-- From Uiverse.io by alexruix -->

  <h4 class="title">Log In!</h4>

      <input autocomplete="off" id="logemail" placeholder="Email" class="input-field" name="logemail" type="email">

  </form>
</div>
</body>
</html>
